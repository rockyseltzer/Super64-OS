; Super 64 OS settings (Altra64 format). Most of these are also in Options.

[ed64]                              ; Menu settings

; Colors (RGBA hex)
border_color_1=FFFFFFFF             ; Border
border_color_2=FFFFFFFF             ; Border, second color
box_color=000000B6                  ; Popup background
selection_color=80008070            ; Selection bar
list_font_color=A8A8A8FF            ; Files: gray
list_dir_font_color=F0E030FF        ; Folders: yellow
selection_font_color=FFFFFFFF       ; Selected entry: white

; File browser
text_offset=0                       ; Horizontal shift of the menu, in characters (for example, -1)
cd_behaviour=1                      ; Entry selected after leaving a folder: 0 = first, 1 = last
scroll_behaviour=0                  ; Scrolling: 0 = page by page, 1 = classic
page_display=1                      ; Page number: 0 = hide, 1 = show
hide_sysfolder=1                    ; ED64P folder: 0 = show, 1 = hide
quick_boot=1                        ; START starts the last played game: 0 = off, 1 = on

; Screen
tv_mode=0                           ; TV mode: 0 = Automatic, 1 = NTSC, 2 = PAL
background=1                        ; Wallpaper: 0 = off, 1 = on
background_image=                   ; Wallpaper file in ED64P/WALLPAPER (PNG, BMP, or JPG; 320x240 or 640x480); empty = built-in background

; Saves and SD card
save_path=SAVES                     ; Save folder inside ED64P
mempak_path=MEMPAKS                 ; Controller Pak folder inside ED64P
ext_type=1                          ; Save file names: 0 = classic, 1 = OS64
save_backup=0                       ; Keep the three previous copies of each save: 0 = off, 1 = on
sd_speed=2                          ; SD card clock: 1 = 25 MHz, 2 = 50 MHz

; Games
crc_check=0                         ; Fix the ROM checksum at load: 0 = off, 1 = on
fast_reboot=0                       ; Relaunch the last played game after a reset (hold B to skip): 0 = off, 1 = on
game_id=1                           ; Send the game ID to PixelFX HDMI mods at launch: 0 = off, 1 = on
cart_speed=0                        ; Cartridge bus timing: 0 = Standard, 1 = Fast, 2 = Fastest

; Counters (kept by the OS)
boot_count=0
game_count=0

